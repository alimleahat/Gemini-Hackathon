<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Virtual FPGA Board — Standalone Demo</title>
  <style>
    :root {
      --bg: #080c12;
      --panel: rgba(14, 20, 30, 0.84);
      --border: rgba(148, 163, 184, 0.18);
      --accent: #34d399;
      --accent-dim: rgba(52, 211, 153, 0.16);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #board-viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 20;
    }

    .hud-card {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      flex-shrink: 0;
    }

    .title-block h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .title-block p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.72);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    button:hover {
      background: rgba(51, 65, 85, 0.85);
      border-color: rgba(148, 163, 184, 0.36);
    }

    button.active {
      background: var(--accent-dim);
      border-color: rgba(52, 211, 153, 0.55);
      color: #a7f3d0;
    }

    .hud-bottom {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 20;
    }

    .telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .telemetry span {
      color: var(--muted);
    }

    .telemetry strong {
      color: #6ee7b7;
      font-weight: 700;
    }

    .event-log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-log .tag {
      color: #38bdf8;
      font-weight: 700;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="board-viewport"></div>

  <header class="hud-top">
    <div class="hud-card">
      <div class="brand-dot"></div>
      <div class="title-block">
        <h1>3D Virtual FPGA Board</h1>
        <p>Drag to rotate &bull; Scroll to zoom &bull; Click switches &amp; pushbuttons</p>
      </div>
    </div>

    <div class="hud-card btn-group">
      <button id="btn-mode-demo" class="active" type="button">Auto Cycle Demo</button>
      <button id="btn-mode-interactive" type="button">Interactive Switch→LED</button>
      <button id="btn-reset-cam" type="button">Reset View</button>
    </div>
  </header>

  <footer class="hud-bottom">
    <div class="hud-card telemetry">
      <div><span>SW:</span> <strong id="val-sw">0x0000</strong></div>
      <div><span>BTN:</span> <strong id="val-btn">0x00</strong></div>
      <div><span>LED:</span> <strong id="val-led">0x0000</strong></div>
      <div><span>7-SEG:</span> <strong id="val-seg">----</strong></div>
    </div>

    <div class="hud-card event-log">
      <span class="tag">onInput:</span>
      <span id="last-event">Click any 3D switch or pushbutton...</span>
    </div>
  </footer>

  <script type="module">
    import { init, update } from "./board3d.js";

    // Active-low 7-segment hex encoding (bit 0=a .. bit 6=g, 0=ON, 1=OFF)
    const HEX_TO_SEG = [
      0x40, // 0
      0x79, // 1
      0x24, // 2
      0x30, // 3
      0x19, // 4
      0x12, // 5
      0x02, // 6
      0x78, // 7
      0x00, // 8
      0x10, // 9
      0x08, // A
      0x03, // b
      0x46, // C
      0x21, // d
      0x06, // E
      0x0e, // F
    ];

    function maskToBits(mask, len) {
      const arr = new Array(len);
      for (let i = 0; i < len; i++) arr[i] = (mask >> i) & 1;
      return arr;
    }

    function bitsToMask(arr) {
      let m = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i]) m |= 1 << i;
      }
      return m;
    }

    // Demo state using the exact { sw[16], btn[5], led[16], seg[7], an[4] } shape
    const demoState = {
      sw: new Array(16).fill(0),
      btn: new Array(5).fill(0),
      led: new Array(16).fill(0),
      seg: new Array(7).fill(1),
      an: [1, 1, 1, 1],
      digits: [0x7f, 0x7f, 0x7f, 0x7f],
    };

    let mode = "demo"; // "demo" | "interactive"
    let tick = 0;

    const elSw = document.getElementById("val-sw");
    const elBtn = document.getElementById("val-btn");
    const elLed = document.getElementById("val-led");
    const elSeg = document.getElementById("val-seg");
    const elLastEvent = document.getElementById("last-event");

    function hex4(n) {
      return "0x" + (n & 0xffff).toString(16).toUpperCase().padStart(4, "0");
    }

    function pushState(displayLabel) {
      update(demoState);
      elSw.textContent = hex4(bitsToMask(demoState.sw));
      elBtn.textContent = "0x" + bitsToMask(demoState.btn).toString(16).toUpperCase().padStart(2, "0");
      elLed.textContent = hex4(bitsToMask(demoState.led));
      if (displayLabel !== undefined) elSeg.textContent = displayLabel;
    }

    function syncInteractiveFromSw() {
      const swVal = bitsToMask(demoState.sw);
      demoState.led = maskToBits(swVal, 16);
      const d0 = HEX_TO_SEG[swVal & 0xf];
      const d1 = HEX_TO_SEG[(swVal >> 4) & 0xf];
      const d2 = HEX_TO_SEG[(swVal >> 8) & 0xf];
      const d3 = HEX_TO_SEG[(swVal >> 12) & 0xf];
      demoState.digits = [d0, d1, d2, d3];
      demoState.seg = maskToBits(d0, 7);
      demoState.an = [0, 0, 0, 0];
      pushState(swVal.toString(16).toUpperCase().padStart(4, "0"));
    }

    const board = init(document.getElementById("board-viewport"), (name, value) => {
      elLastEvent.textContent = `onInput("${name}", ${value})`;

      if (name.startsWith("sw")) {
        const idx = Number(name.slice(2));
        demoState.sw[idx] = value;
        if (mode === "interactive") {
          syncInteractiveFromSw();
        } else {
          // Even in auto demo, reflect the user's switch click immediately
          demoState.led[idx] = value;
          pushState();
        }
      } else if (name.startsWith("btn")) {
        const idx = Number(name.slice(3));
        demoState.btn[idx] = value;
        if (mode === "interactive" && value === 1) {
          let swVal = bitsToMask(demoState.sw);
          if (idx === 0) swVal = 0;                          // BTNC: clear
          else if (idx === 1) swVal = (swVal + 1) & 0xffff;  // BTNU: +1
          else if (idx === 4) swVal = (swVal - 1) & 0xffff;  // BTND: -1
          else if (idx === 2) swVal = ((swVal << 1) | (swVal >>> 15)) & 0xffff; // BTNL: rot left
          else if (idx === 3) swVal = ((swVal >>> 1) | (swVal << 15)) & 0xffff; // BTNR: rot right
          demoState.sw = maskToBits(swVal, 16);
          syncInteractiveFromSw();
        } else {
          pushState();
        }
      }
    });

    // Mode buttons
    const btnDemo = document.getElementById("btn-mode-demo");
    const btnInteractive = document.getElementById("btn-mode-interactive");

    btnDemo.addEventListener("click", () => {
      mode = "demo";
      btnDemo.classList.add("active");
      btnInteractive.classList.remove("active");
    });

    btnInteractive.addEventListener("click", () => {
      mode = "interactive";
      btnInteractive.classList.add("active");
      btnDemo.classList.remove("active");
      syncInteractiveFromSw();
    });

    document.getElementById("btn-reset-cam").addEventListener("click", () => {
      board.resetCamera();
    });

    // Auto-cycle animation for standalone showcase
    function stepDemo() {
      if (mode !== "demo") return;
      tick++;

      // Knight Rider / Cylon scanner on upper 8 LEDs + binary counter on lower 8 LEDs
      const scanPos = Math.abs((tick % 14) - 7); // 0..7..0
      const upperMask = (0b11 << scanPos) & 0xff;
      const lowerMask = tick & 0xff;
      const ledMask = ((upperMask << 8) | lowerMask) & 0xffff;

      // Also flip a few switches gently in demo mode? Keep user's switches untouched,
      // OR combine user switches with demo pattern so clicking switches is always visible!
      const userSwMask = bitsToMask(demoState.sw);
      demoState.led = maskToBits(ledMask ^ userSwMask, 16);

      // Cycle 4-digit hex counter on 7-segment display
      const dispNum = (0x1230 + tick) & 0xffff;
      const d0 = HEX_TO_SEG[dispNum & 0xf];
      const d1 = HEX_TO_SEG[(dispNum >> 4) & 0xf];
      const d2 = HEX_TO_SEG[(dispNum >> 8) & 0xf];
      const d3 = HEX_TO_SEG[(dispNum >> 12) & 0xf];

      demoState.seg = maskToBits(d0, 7);
      demoState.an = [0, 0, 0, 0];
      demoState.digits = [d0, d1, d2, d3];

      pushState(dispNum.toString(16).toUpperCase().padStart(4, "0"));
    }

    stepDemo();
    setInterval(stepDemo, 260);
  </script>
</body>
</html>
